<div class="prof-page">

  <div class="loading-wrap" *ngIf="loading">
    <div class="spin"></div>
    <span>Loading profile…</span>
  </div>

  <ng-container *ngIf="!loading">

    <!-- Dirty banner -->
    <div class="dirty-bar" *ngIf="dirty">
      <div class="dirty-left">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        You have unsaved changes
      </div>
      <div class="dirty-actions">
        <button class="btn-discard" (click)="discard()">Discard</button>
        <button class="btn-save" (click)="save()" [disabled]="saving">{{saving ? 'Saving…' : 'Save Now'}}</button>
      </div>
    </div>

    <!-- Single card -->
    <div class="prof-card">

      <!-- ── HERO ───────────────────────────────────────────────── -->
      <div class="prof-hero">
        <div class="hero-bg"></div>

        <div class="prof-av-zone">
          <div class="prof-av">
            <img *ngIf="avatarSrc" [src]="avatarSrc" alt="avatar">
            <span *ngIf="!avatarSrc">{{(form.username || 'C')[0] | uppercase}}</span>
          </div>
          <div class="verified-ring" *ngIf="profile?.isVerified">
            <svg fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <label class="av-edit-btn" title="Change photo">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
            <input type="file" accept="image/*" (change)="onFileChange($event)" style="display:none">
          </label>
        </div>

        <div class="prof-hero-text">
          <div class="prof-handle">{{displayHandle}}</div>
          <div class="prof-chips">
            <span class="chip niche-chip">{{form.niche || 'No niche'}}</span>
            <span class="chip verified-chip" *ngIf="profile?.isVerified">✓ Verified</span>
          </div>
          <div class="prof-location" *ngIf="form.country">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:12px;height:12px">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            {{form.country}}
          </div>
        </div>

        <div class="hero-actions">
          <button class="btn-save" (click)="save()" [disabled]="saving" *ngIf="dirty">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" style="width:13px;height:13px">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            {{saving ? 'Saving…' : 'Save'}}
          </button>
          <button class="btn-discard" (click)="discard()" *ngIf="dirty">Discard</button>
        </div>
      </div>

      <div class="prof-divider"></div>

      <!-- ── FORM GRID ──────────────────────────────────────────── -->
      <div class="form-section">
        <div class="fsec-label">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          Identity
        </div>
        <div class="fgrid">
          <div class="ff">
            <label>Username</label>
            <div class="fin-wrap has-prefix">
              <span class="fin-pre">&#64;</span>
              <input [(ngModel)]="form.username" (ngModelChange)="dirty=true" placeholder="yourhandle">
            </div>
          </div>
          <div class="ff">
            <label>Country</label>
            <select [(ngModel)]="form.country" (ngModelChange)="dirty=true">
              <option value="">Select country</option>
              <option *ngFor="let c of countries" [value]="c">{{c}}</option>
            </select>
          </div>
          <div class="ff">
            <label>Niche / Category</label>
            <select [(ngModel)]="form.niche" (ngModelChange)="dirty=true">
              <option *ngFor="let n of niches" [value]="n">{{n}}</option>
            </select>
          </div>
          <div class="ff ff-full">
            <label>Bio</label>
            <textarea [(ngModel)]="form.bio" (ngModelChange)="dirty=true" rows="3" placeholder="Tell brands about yourself, your style and your audience…"></textarea>
          </div>
        </div>

        <div class="prof-divider" style="margin:20px 0"></div>

        <div class="fsec-label">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contact Information
        </div>
        <div class="fgrid">
          <div class="ff">
            <label>Phone Number</label>
            <div class="fin-wrap has-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" class="fin-ico"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              <input [(ngModel)]="form.contactInfo.phone" (ngModelChange)="dirty=true" placeholder="+91 9876543210">
            </div>
          </div>
          <div class="ff">
            <label>Website</label>
            <div class="fin-wrap has-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" class="fin-ico"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
              <input [(ngModel)]="form.contactInfo.website" (ngModelChange)="dirty=true" placeholder="https://yoursite.com">
            </div>
          </div>
          <div class="ff ff-full">
            <label>LinkedIn</label>
            <div class="fin-wrap has-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" class="fin-ico"><path stroke-linecap="round" stroke-linejoin="round" d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
              <input [(ngModel)]="form.contactInfo.linkedin" (ngModelChange)="dirty=true" placeholder="linkedin.com/in/yourname">
            </div>
          </div>
        </div>
      </div>

      <!-- ── FOOTER SAVE BAR ────────────────────────────────────── -->
      <div class="prof-footer" *ngIf="dirty">
        <button class="btn-discard" (click)="discard()">Discard Changes</button>
        <button class="btn-save" (click)="save()" [disabled]="saving">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" style="width:14px;height:14px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          {{saving ? 'Saving…' : 'Save Changes'}}
        </button>
      </div>
      <div class="prof-footer no-changes" *ngIf="!dirty">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;color:var(--j)"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        Profile is up to date — edit any field above to make changes
      </div>

    </div>
  </ng-container>

  <div class="toast-msg" *ngIf="toast.show" [class.err]="toast.type==='error'">{{toast.msg}}</div>
</div>
