<div class="dr">

  <!-- ══ SIDEBAR ══════════════════════════════════════════════════════ -->
  <aside class="sb" [ngClass]="{'col': collapsed}">

    <!-- Brand header -->
    <div class="sb-top">
      <div class="sb-logo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <span class="sb-lbl">Collab<span>Space</span></span>
      <button class="sb-tog" (click)="collapsed=!collapsed" [title]="collapsed ? 'Expand' : 'Collapse'" title="btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sb-nav">
      <ng-container *ngFor="let section of sections; let i=index; let last=last">
        <div class="sb-sec">{{section}}</div>

        <a class="sb-ni" *ngFor="let item of itemsFor(section); let ni=index"
          [ngClass]="{'sb-ni--on': activePage === item.id}"
          (click)="navigate(item.id)"
          [style.animation-delay]="(i*0.06 + ni*0.03) + 's'">

          <div class="sb-ic"
            [ngStyle]="{'background': activePage===item.id ? 'rgba(139,92,246,.15)' : 'rgba(255,255,255,.03)'}">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
              [ngStyle]="{'color': activePage===item.id ? '#A78BFA' : 'var(--t3)'}">
              <ng-container *ngIf="item.icon==='grid'">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              </ng-container>
              <path *ngIf="item.icon==='user'"      stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              <path *ngIf="item.icon==='share'"     stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
              <path *ngIf="item.icon==='briefcase'" stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              <path *ngIf="item.icon==='search'"    stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              <path *ngIf="item.icon==='mail'"      stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              <path *ngIf="item.icon==='upload'"    stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              <path *ngIf="item.icon==='folder'"    stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
              <path *ngIf="item.icon==='sparkles'"  stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
              <path *ngIf="item.icon==='chart'"     stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              <path *ngIf="item.icon==='users'"     stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
              <path *ngIf="item.icon==='trending'"  stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
              <path *ngIf="item.icon==='dollar'"    stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              <path *ngIf="item.icon==='document'"  stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              <path *ngIf="item.icon==='chat'"      stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
              <path *ngIf="item.icon==='bell'"      stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
          </div>

          <span class="sb-nm">{{item.label}}</span>
          <span class="sb-bge" *ngIf="badge(item) > 0">{{badge(item)}}</span>
        </a>

        <div class="sb-sep" *ngIf="!last"></div>
      </ng-container>
    </nav>

    <!-- Profile footer -->
    <div class="sb-pf">
      <div class="sb-av">{{initials}}</div>
      <div style="flex:1;min-width:0">
        <div class="sb-pname">{{user?.firstName}} {{user?.lastName}}</div>
        <div class="sb-prole">Creator</div>
      </div>
      <button class="sb-out" (click)="logout()" title="Sign out">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ══ MAIN CONTENT ══════════════════════════════════════════════════ -->
  <main class="mn">
    <div class="pg-wrap">
      <app-creator-overview      *ngIf="activePage==='overview'"      (navigate)="navigate($event)"></app-creator-overview>
      <app-creator-profile       *ngIf="activePage==='profile'"></app-creator-profile>
      <app-creator-social        *ngIf="activePage==='social'"></app-creator-social>
      <app-creator-portfolio     *ngIf="activePage==='portfolio'"></app-creator-portfolio>
      <app-creator-applications  *ngIf="activePage==='applications'"></app-creator-applications>
      <app-creator-invitations   *ngIf="activePage==='invitations'"></app-creator-invitations>
      <app-creator-collab-posts  *ngIf="activePage==='collabposts'"></app-creator-collab-posts>
      <app-creator-content       *ngIf="activePage==='content'"></app-creator-content>
      <app-creator-ai-tools      *ngIf="activePage==='ai'"></app-creator-ai-tools>
      <app-creator-analytics     *ngIf="activePage==='analytics'"></app-creator-analytics>
      <app-creator-audience      *ngIf="activePage==='audience'"></app-creator-audience>
      <app-creator-growth        *ngIf="activePage==='growth'"></app-creator-growth>
      <app-creator-revenue       *ngIf="activePage==='revenue'"></app-creator-revenue>
      <app-creator-contracts     *ngIf="activePage==='contracts'"></app-creator-contracts>
      <app-creator-messages      *ngIf="activePage==='messages'"></app-creator-messages>
      <app-creator-notifications *ngIf="activePage==='notifications'"></app-creator-notifications>
    </div>
  </main>
</div>
